# Prefix: Ctrl-Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Keep the familiar home-row cluster for pane movement.
bind-key -r e select-pane -U
bind-key -r s select-pane -L
bind-key -r d select-pane -D
bind-key -r f select-pane -R

# Split the current working directory: h makes side-by-side panes; v stacks them.
bind-key h split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"

# Mouse selects panes/windows, resizes panes, and scrolls history.
set-option -g mouse on

# Status line
set-option -g status-position bottom
set-option -g status-style "bg=colour54,fg=colour255"
set-option -g status-left " #[fg=colour255,bold]#S "
set-option -g status-left-length 30
set-option -g status-right "#[fg=colour255]%Y-%m-%d #[bold]%H:%M "
set-option -g status-right-length 40
set-window-option -g window-status-format " #[fg=colour189]#I:#W "
set-window-option -g window-status-current-format "#[bg=colour129,fg=colour255,bold] #I:#W "

# A few practical defaults.
set-option -g history-limit 50000
set-option -g renumber-windows on
set-window-option -g mode-keys vi
